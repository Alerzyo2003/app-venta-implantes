# Configuración de la Supabase CLI para desarrollo local (`supabase start`, requiere Docker).
# Los proyectos remotos (dev/staging/prod) se configuran en el panel de Supabase; ver docs/01-arquitectura.md.
# PENDIENTE: validar este archivo con la CLI en un equipo con Docker (en el entorno de construcción
# inicial no fue posible descargar las imágenes; ver docs/adr/0007-pruebas-bd-sin-docker.md).
project_id = "app-venta-implantes"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Debe coincidir con packages/domain/src/validation.ts (PASSWORD_MIN_LENGTH y letras + números).
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
# CTA-02: verificación de correo obligatoria.
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

# CTA-13: MFA TOTP para el personal interno.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
